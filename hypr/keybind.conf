# Selector de wallpapers skwd-wall
# Para Hyprland con configuracion CLASICA (hyprlang, hyprland.conf).
# Si tu Hyprland usa hyprland.lua, esta linea NO hace nada: usa keybind.lua.

# --- Hyprland normal -> ~/.config/hypr/hyprland.conf ---
bind = SUPER SHIFT, T, exec, skwd wall toggle

# --- Caelestia -> ~/.config/caelestia/hypr-user.conf ---
# Los binds de Caelestia viven en el submap 'global' y la sesion se queda ahi,
# asi que un bind suelto cae en el submap por defecto (inactivo) y no dispara.
# Usa ESTA version en su lugar:
#
#   submap = global
#   bind = Super+Shift, T, exec, skwd wall toggle
#   submap = reset
